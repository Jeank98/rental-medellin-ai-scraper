[project]
name = "rental-medellin-ai-scraper"
version = "0.1.0"
description = "AI-agent-driven real estate rental scraper for Colombian portals"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12,<5",
    "curl-cffi>=0.16.1,<1",
    "google-api-python-client>=2.100,<3",
    "google-auth>=2.0,<3",
    "google-auth-oauthlib>=1.2,<2",
    "playwright>=1.40,<2",
    "psycopg2-binary>=2.9,<3",
    "python-dotenv>=1.0,<2",
    "scrapling[fetchers]>=0.4.8,<0.5",
]

[dependency-groups]
dev = [
    "pytest>=7,<9",
]

[tool.uv]
package = false
